# Windows-Programmpaket (ZIEL M9): Exe mit PyInstaller bauen, Selbsttest mit der Exe, Paket als Artefakt
name: Paket
on:
  push:
    branches: [claude/ai-schaltplan-generator-u6lzbz, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-paket:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: schaltplan_generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Paket bauen
        run: python paket_bauen.py
      - name: Startprüfung der Exe (Hilfe, Selbsttest wie Menüpunkt 5, Excel-Weg, KI-Auftrag)
        working-directory: schaltplan_generator/dist/Stromlaufplan-Generator
        shell: cmd
        run: |
          programm\slpgen.exe --help || exit /b 1
          programm\slpgen.exe generieren beispiele\projekt_beispiel.yaml --ausgabe ausgabe\selbsttest || exit /b 1
          programm\slpgen.exe generieren beispiele\Projekt_Vorlage.xlsx --ausgabe ausgabe\excel || exit /b 1
          programm\slpgen.exe ki-auftrag beispiele\lastenheft_beispiel.md --ziel ausgabe\ki_auftrag.txt || exit /b 1
          if not exist ausgabe\selbsttest\P-2026-001_Stromlaufplan_Hausstil.pdf exit /b 1
          if exist hausprofil exit /b 1
      - name: Startprüfung der Oberfläche (Exe, nur 127.0.0.1)
        working-directory: schaltplan_generator/dist/Stromlaufplan-Generator
        shell: pwsh
        run: |
          $p = Start-Process programm\slpgen.exe -ArgumentList "oberflaeche","--nicht-oeffnen","--port","8765" -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if ($r.Content -notmatch "Projekt anlegen") { exit 1 }
      - name: Prüfausgaben entfernen
        working-directory: schaltplan_generator/dist/Stromlaufplan-Generator
        shell: cmd
        run: |
          rmdir /s /q ausgabe
      - uses: actions/upload-artifact@v4
        with:
          name: Stromlaufplan-Generator-Windows
          path: schaltplan_generator/dist/Stromlaufplan-Generator
          retention-days: 14
