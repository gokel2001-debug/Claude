# Bausteinbibliothek (Typicals): eine Funktion mit mehreren Signalen, Zusatzbauteilen und
# Klemmenbelegung. Feldgerät mit Spalte „typical“ verwendet den Baustein statt des Einzelsignals.
#   versorgung: Klemme -> Geräteanschluss;  signale: SPS-Signal je Kanal (art, text, pin)
#   bauteile:   zusätzliche Schrankbauteile (lokales BMK, Artikel, Text, 24-V-Gruppe)
typicals:
  # Signal-Optionen: ueber = Schrankbauteil, dessen Kontakt das Signal ins Feld gibt (DO -> Koppelrelais);
  #                  rueckleiter = zweiter Anschluss (z. B. 4–20 mA Minus); speisung = 24-V-Speisung eines Kontakts
  zaehler_di:
    beschreibung: Zähler mit Impuls- und Störausgang (2 Digitaleingänge), Abschlusswiderstand an der Klemme
    versorgung: {"+24V": "24V", "0V": "GND"}
    signale:
      - {art: DI, text: Zählimpuls, pin: I1}
      - {art: DI, text: Störung Drahtbruch, pin: I2}
    bauteile:
      - {bmk: "-R1", artikel: WID-2K2, text: Abschlusswiderstand an der Klemme}
  zaehler_ai:
    beschreibung: Zähler mit Impuls und Durchfluss-Messwert 4–20 mA (aktiver Ausgang, 4-Leiter)
    versorgung: {"+24V": "24V", "0V": "GND"}
    signale:
      - {art: DI, text: Zählimpuls, pin: I1}
      - {art: AI, text: Messwert Durchfluss, pin: AO+, rueckleiter: AO-}
  stellantrieb_ao:
    beschreibung: Stellantrieb mit Freigabe über Koppelrelais, Stellsignal 4–20 mA und Betriebsrückmeldung
    versorgung: {"+24V": "24V", "0V": "GND"}
    signale:
      - {art: DO, text: Freigabe, pin: S/S, ueber: "-K1"}
      - {art: AO, text: Stellsignal 4-20mA, pin: IN+, rueckleiter: IN-}
      - {art: DI, text: Betrieb, pin: "NO", speisung: COM}
    bauteile:
      - {bmk: "-K1", artikel: KR-24DC, text: Koppelrelais Freigabe, gruppe: DO-Last}
  pumpe_ec:
    beschreibung: Pumpe 1~230 V mit Motorschutzschalter, Start/Stopp über Koppelrelais (potentialfrei), Stellsignal, Betriebs-/Störmeldung
    versorgung: {}
    leistung: {phasen: 1, u_V: 230, schutz: motorschutz, kabel_adern: 3, pins: {L: "L", N: "N", PE: "PE"}}
    signale:
      - {art: DO, text: Start/Stopp, pin: S/S, ueber: "-K1", rueckkontakt: GND}
      - {art: AO, text: Stellsignal 4-20mA, pin: IN+, rueckleiter: IN-}
      - {art: DI, text: Betrieb, pin: NO1, speisung: C1}
      - {art: DI, text: Störung, pin: NO2, speisung: C2}
      - {art: DI, text: Motorschutz eingeschaltet, quelle: "-Q1"}   # 13/14 = Schließer: 0 = ausgelöst/AUS
    bauteile:
      - {bmk: "-K1", artikel: KR-24DC, text: Koppelrelais Start/Stopp, gruppe: DO-Last}
