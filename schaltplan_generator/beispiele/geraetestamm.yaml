# Gerätestamm (Artikelstamm) – BEISPIELDATEN
# Artikelnummern/Hersteller sind Platzhalter, KEINE realen Produkte.
# Im Betrieb werden diese Einträge aus Datenblättern befüllt (manuell oder per
# `python -m slpgen datenblatt <pdf>` als Vorschlag) und vor Freigabe geprüft.
#
# Pflichtfelder je Kategorie:
#   netzteil:  u_aus_V, i_nenn_A, wirkungsgrad, u_ein_V, vorsicherung_A
#   sensor:    u_V, i_mA, signal (DI|AI), anschluss (Liste Klemmenbezeichner)
#   aktor:     u_V, p_W oder i_mA, signal (DO|AO), anschluss
#   sps_*:     kanaele, i_mA (Eigenbedarf an 24 V)
#   schutz:    i_nenn_A, charakteristik

